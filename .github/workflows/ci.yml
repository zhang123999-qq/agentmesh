name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 06:17 UTC — catch newly published CVEs even with no code change.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Same as the local gate — not trimmed.
      - name: npm run verify (typecheck + lint + test + web build + web audit)
        run: npm run verify
      - name: audit (all deps)
        run: npm audit --audit-level=high
      - name: audit (runtime / omit dev)
        run: npm audit --omit=dev --audit-level=high
      - name: demo (end-to-end)
        run: npm run demo

  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Install Playwright ad-hoc WITHOUT touching the committed lockfile (the
      # local npm arborist bug cannot regenerate the lock; CI runs clean).
      - name: Install Playwright + chromium
        run: |
          npm install --no-save @playwright/test -w @agentmesh/web
          npx playwright install --with-deps chromium
      - name: Build (embed WS url for the web bundle)
        run: npm run build
        env:
          NEXT_PUBLIC_WS_URL: ws://localhost:8787/ws
      - name: Run e2e against a real local stack
        run: |
          set -euo pipefail
          export NODE_ENV=production
          export DB_PATH="$RUNNER_TEMP/agentmesh-ci.db"
          export JWT_SECRET="$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))")"
          export ALLOWED_ORIGINS="http://localhost:3000"
          export HOST=127.0.0.1
          export PORT=8787
          export LOG_LEVEL=warn

          node apps/server/dist/cli/migrate.js --db "$DB_PATH" >/dev/null
          SEED="$(node apps/server/dist/cli/seed-admin.js --name admin --owner ci)"
          echo "$SEED"
          ADMIN_AGENT_ID="$(printf '%s\n' "$SEED" | sed -n 's/^admin created: agentId=\([^ ]*\) name=.*/\1/p')"
          ADMIN_SECRET="$(printf '%s\n' "$SEED" | sed -n 's/^secret: \(.*\)$/\1/p')"
          test -n "$ADMIN_AGENT_ID"
          test -n "$ADMIN_SECRET"

          nohup node apps/server/dist/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          SERVER_PID=$!
          nohup npm run start -w @agentmesh/web > "$RUNNER_TEMP/web.log" 2>&1 &
          WEB_PID=$!
          trap 'kill "$SERVER_PID" "$WEB_PID" 2>/dev/null || true' EXIT

          wait_url() {
            for _ in $(seq 1 90); do
              curl -fsS "$1" >/dev/null 2>&1 && return 0 || sleep 1
            done
            echo "timed out waiting for $1" >&2
            echo "--- server.log ---" >&2; cat "$RUNNER_TEMP/server.log" 2>/dev/null || true
            echo "--- web.log ---" >&2; cat "$RUNNER_TEMP/web.log" 2>/dev/null || true
            return 1
          }
          # Give the processes a moment, then surface early startup errors.
          sleep 3
          echo "--- server.log (startup) ---"; cat "$RUNNER_TEMP/server.log" 2>/dev/null || true
          echo "--- web.log (startup) ---"; cat "$RUNNER_TEMP/web.log" 2>/dev/null || true
          wait_url http://127.0.0.1:8787/health
          wait_url http://127.0.0.1:3000/login

          BASE_URL=http://localhost:3000 \
          ADMIN_AGENT_ID="$ADMIN_AGENT_ID" ADMIN_SECRET="$ADMIN_SECRET" \
            npx playwright test --config apps/web/e2e/playwright.config.ts
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
          if-no-files-found: ignore

  audit-cron:
    name: audit (cron, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: audit all (includes dev)
        run: npm audit --audit-level=moderate
