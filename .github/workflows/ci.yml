name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily at 06:17 UTC — catch newly published CVEs even with no code change.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Same as the local gate — not trimmed.
      - name: npm run verify (typecheck + lint + test + web build + web audit)
        run: npm run verify
      - name: audit (all deps)
        run: npm audit --audit-level=high
      - name: audit (runtime / omit dev)
        run: npm audit --omit=dev --audit-level=high
      - name: demo (end-to-end)
        run: npm run demo

  web-e2e:
    name: web e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Install Playwright ad-hoc WITHOUT touching the committed lockfile (the
      # local npm arborist bug cannot regenerate the lock; CI runs clean).
      - name: Install Playwright + chromium
        run: |
          npm install --no-save @playwright/test -w @agentmesh/web
          npx playwright install --with-deps chromium
      - name: Build + run e2e against a real local stack
        run: bash .github/scripts/e2e.sh
      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
          if-no-files-found: ignore

  audit-cron:
    name: audit (cron, advisory)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: audit all (includes dev)
        run: npm audit --audit-level=moderate
