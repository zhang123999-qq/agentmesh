name: agentmesh

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      HOST: 0.0.0.0
      DB_PATH: /app/data/agentmesh.db
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://localhost}
    secrets:
      - jwt_secret
    volumes:
      - agentmesh_data:/app/data
    expose:
      - "8787"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      CADDY_TLS_DIRECTIVE: ${CADDY_TLS_DIRECTIVE:-tls internal}
    ports:
      - "${HTTPS_PORT:-8443}:443"
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

secrets:
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  agentmesh_data:
  caddy_data:
  caddy_config:
